<a
  href="#contenido"
  class="sr-only focus:not-sr-only focus:fixed focus:z-50 focus:bg-white focus:p-3"
  >Saltar al contenido</a
>
<div class="min-h-dvh lg:grid lg:grid-cols-[240px_1fr]">
  <aside
    class="flex flex-col bg-slate-950 px-5 py-6 text-white lg:sticky lg:top-0 lg:h-dvh lg:py-8"
  >
    <a [routerLink]="'/' + rutas.Ordenes" class="flex items-center gap-3 px-2"
      ><span class="grid size-10 place-items-center rounded-xl bg-orange-500 text-xl font-black"
        >S</span
      ><span class="text-xl font-bold"
        >Subocol<span class="mt-0.5 block text-xs font-normal text-slate-400"
          >Taller automotriz</span
        ></span
      ></a
    >
    <p
      class="mb-3 mt-10 hidden px-3 text-[10px] font-semibold tracking-[.2em] text-slate-500 lg:block"
    >
      ESPACIO DE TRABAJO
    </p>
    <button
      type="button"
      class="mobile-menu mt-4 rounded-lg border border-slate-700 px-4 py-2 text-sm lg:hidden"
      (click)="menuAbierto.set(!menuAbierto())"
      [attr.aria-expanded]="menuAbierto()"
      aria-controls="menu-principal"
    >
      Menú de navegación
    </button>
    <nav
      id="menu-principal"
      [class.mobile-hidden]="!menuAbierto()"
      (click)="menuAbierto.set(false)"
      aria-label="Navegación principal"
      class="mt-5 flex flex-wrap gap-2 lg:mt-0 lg:flex-col"
    >
      <a
        [routerLink]="'/' + rutas.Ordenes"
        routerLinkActive="bg-slate-800 text-white"
        class="flex-1 rounded-xl px-4 py-3 text-sm font-medium text-slate-300 hover:bg-slate-900"
        >Órdenes de servicio</a
      >
      <a
        [routerLink]="'/' + rutas.Agenda"
        [routerLinkActiveOptions]="{ exact: true }"
        routerLinkActive="bg-slate-800 text-white"
        class="flex-1 rounded-xl px-4 py-3 text-sm font-medium text-slate-300 hover:bg-slate-900"
        >Agenda de citas</a
      >
      <a
        [routerLink]="'/' + rutas.Franjas"
        routerLinkActive="bg-slate-800 text-white"
        class="flex-1 rounded-xl px-4 py-3 text-sm font-medium text-slate-300 hover:bg-slate-900"
        >Franjas y cupos</a
      ><a
        [routerLink]="'/' + rutas.Notificaciones"
        routerLinkActive="bg-slate-800 text-white"
        class="flex-1 rounded-xl px-4 py-3 text-sm font-medium text-slate-300 hover:bg-slate-900"
        >Notificaciones</a
      >
    </nav>
    <div class="mt-6 flex items-center justify-between border-t border-slate-800 pt-5 lg:mt-auto">
      <span class="truncate px-2 text-sm text-slate-300">{{ session.usuario() }}</span><button
        type="button"
        (click)="salir()"
        class="rounded-lg px-3 py-2 text-xs text-slate-400 hover:bg-slate-800 hover:text-white"
      >
        Salir
      </button>
    </div>
  </aside>
  <div class="min-w-0">
    <header
      class="workspace-header flex flex-wrap gap-3 items-center justify-between border-b border-slate-200 bg-white px-6 py-5 lg:px-10"
    >
      <span class="text-sm text-slate-500">Gestión del taller</span
      ><span class="rounded-full bg-orange-50 px-3 py-1 text-xs font-medium text-orange-700"
        >Panel del asesor</span
      >
      <button
        type="button"
        class="secondary"
        (click)="cambiarTema()"
        [attr.aria-pressed]="oscuro()"
        aria-label="Activar o desactivar modo oscuro"
      >
        {{ oscuro() ? '☀ Modo claro' : '☾ Modo oscuro' }}
      </button>
    </header>
    <main id="contenido" class="mx-auto max-w-7xl px-5 py-8 sm:px-8 lg:p-10">
      <router-outlet />
    </main>
  </div>
</div>
